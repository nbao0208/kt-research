# Attention-based Contextual KT model configuration
# SAKT/AKT hybrid with causal multi-head attention and monotonic decay

name: attention_kt
variant: core

embedding_dim: 64
num_heads: 2
num_layers: 1
dropout: 0.2
max_seq_len: 200
stride: 100
min_history: 1

use_position: true
use_decay: true
decay_type: position

use_aux: false
aux_features:
  - timeTaken
  - hintCount
  - attemptCount
  - scaffold
  - hintTotal

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.00001

trainer:
  batch_size: 256
  max_epochs: 50
  early_stopping_patience: 5
  gradient_clip_norm: 1.0

seed: 42