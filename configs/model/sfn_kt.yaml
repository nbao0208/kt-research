name: sfn_kt

# Fast Sequential Backbone & Embeddings
d_model: 128
num_queries: 4
nheads: 4
nlayers: 2
dim_feedforward: 512
dropout: 0.1
max_seq_len: 200
d_llm: 2048

# Cognitive Anomaly Regulator (SCDT)
scdt:
  lambda_entropy: 0.3
  target_trigger_rate: 0.05
  lambda_momentum: 0.0 # Failure momentum weight (0.0 = disabled)
  lambda_conflict: 0.0 # Slip/guess conflict weight (0.0 = disabled)

# Composite Loss Parameters
loss:
  alpha: 0.75
  beta: 0.1
  tau_s: 0.05

# Foundation Model Reasoning Core (LLM)
llm:
  backend: mock # Options: 'mock', 'ollama', 'google', 'gemini', 'api', 'openai', 'deepseek', 'huggingface', 'vllm'
  model_name: Qwen/Qwen2.5-Math-7B # e.g. 'qwen2.5:7b' (ollama), 'gemini-1.5-flash' (google), 'Qwen/Qwen2.5-Math-7B' (hf)
  encoder_name: sentence-transformers/all-MiniLM-L6-v2 # Lightweight text encoder for CoT representation
  d_llm: 2048 # Output dimension for Q-Former input (MiniLM 384 automatically projects to d_llm if d_llm != 384)
  max_tokens: 128
  device: cpu
  target_layer: -2 # Only used for huggingface backend
  api_key: null # API key for Google Gemini, OpenAI, DeepSeek, etc.
  base_url: null # Base URL (e.g. 'http://localhost:11434' for Ollama, 'https://api.deepseek.com/v1')
  text_cache_path: null # Path to JSON cache for generated rationales (e.g. 'outputs/artifacts/sfn_kt/llm_text_cache.json')


